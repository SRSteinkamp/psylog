[build-system]
requires = ["setuptools >=84.2.1", "versioneer == 0.29"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["psylog*"]

[project]
name = "psylog"
dynamic = ["version"]
authors = [
    { name = "SRSteinkamp", email= "rewardgym@mailbox.org" },
    ]
description = "psylog is a small library initially written to log PsychoPy experiments. As I kept copying the scripts, I decided, it's worth to try to abstract for the future."
readme = "README.md"
license-files = ["LICEN[CS]E*"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
]

requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
doc = [
    "sphinx>=2.0",
    "sphinx_rtd_theme",
    "myst-parser[linkify]",
    "sphinx-copybutton",
    "sphinx-autoapi",
]
style = [
    "ruff",
    "pydocstyle",
    "codespell"
]
test = [
    "psylog[style]",
    "pytest>=5.3",
    "pytest-cov",
    "coverage"
]
regression =[
    "rewardgym @ git+https://github.com/rewardMap/rewardGym.git@v0.6.1",
    "pandas"
]
devtools = [
    "pre-commit",
    "jupyter"
]
dev = ["psylog[devtools,doc,test,regression]"]

[project.urls]
Source = "https://github.com/SRSteinkamp/psylog"
Issues = "https://github.com/SRSteinkamp/psylog/issues"

[project.scripts]

[tool.pytest.ini_options]
doctest_optionflags = "NORMALIZE_WHITESPACE"
xfail_strict = true
addopts = [
    "--import-mode=importlib",
    "-rx"
]

[tool.pydocstyle]
convention = "numpy"
match = "psylog/*.py"
match-dir = "psylog/[^tests]*"

[tool.codespell]
skip = [".git", "build", "./docs/_build"]
ignore-words-list = [""]
write-changes = true
count = true
quiet-level = 3

[tool.ruff.lint.per-file-ignores]
"psylog/tests/*" = ["E712"]
"notebooks/*" = ["E402"]
"psylog/io_streams.py" = ["SIM115"]

[tool.ruff]
exclude = [
    ".autorc",
    ".coverage*",
    ".readthedocs.yml",
    ".zenodo.json",
    "codecov.yml",
    "setup.py",
    "versioneer.py",
    "psylog/_version.py"
]
target-version = "py311"

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "psylog/_version.py"
versionfile_build = "psylog/_version.py"
tag_prefix = ""
parentdir_prefix = ""
