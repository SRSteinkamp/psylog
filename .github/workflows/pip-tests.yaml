name: Python test

on: [pull_request]

jobs:
  build:

    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive   # Fetch all submodules recursively
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # You can test your matrix by printing the current Python version
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install
        run: pip install -e '.[test,regression]'
      - name: Debug rewardgym
        run: |
          python -c "import rewardgym; print(rewardgym.__file__)"
          python -c "import rewardgym; print(rewardgym.__path__)"
          python -m pip show rewardgym
          python -m pip freeze | grep -i rewardgym
          python -c "import rewardgym; print(rewardgym.ENVIRONMENTS); print(rewardgym._task_registry); print(list((rewardgym.TASKS_DIR / 'tasks').iterdir()))"
      - name: Lint with ruff
        run: |
          # stop the build if there are Python syntax errors or undefined names
          ruff check .
      - name: Run tests and collect coverage
        run: pytest --cov --cov-report=xml
